<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f8f3">
  <title>Pawfolio | Pet Records</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Pawfolio home" data-page="dashboard">
        <span class="brand-mark" aria-hidden="true">✿</span>
        <span>Pawfolio<small>Pet care, together</small></span>
      </a>

      <div class="side-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard"><span>◫</span> Dashboard</button>
        <button class="nav-link" data-page="pets"><span>♡</span> Pets</button>
        <button class="nav-link" data-page="owners"><span>♧</span> Owners</button>
        <button class="nav-link" data-page="vaccinations"><span>✚</span> Vaccinations</button>
      </nav>

      <div class="sidebar-note">
        <span class="note-icon">✦</span>
        <strong>Every pet deserves<br>a little extra care.</strong>
        <span>Keep their records close and their tails wagging.</span>
      </div>
      <div class="sidebar-footer"><span class="online-dot"></span> All records saved on this device</div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageCrumb">Dashboard</strong></div>
        <div class="topbar-actions">
          <label class="global-search">
            <span aria-hidden="true">⌕</span>
            <input id="globalSearch" type="search" placeholder="Search pets, owners, breeds..." aria-label="Search pets, owners, or breeds">
            <kbd>/</kbd>
          </label>
          <button class="avatar" title="Pawfolio workspace">P</button>
        </div>
      </header>
      <section id="pageContent" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
</body>
</html>
